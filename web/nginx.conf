server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # EventSource tokens are carried in the query string. Do not write the
    # request URI to either access or error logs for this route.
    location ~ ^/api/projects/[^/]+/events$ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
