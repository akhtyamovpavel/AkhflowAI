name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          AKHFLOW_ISOLATION_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          AKHFLOW_AGENT_USAGE_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          AKHFLOW_ROLES_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          AKHFLOW_ASSIGNEE_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          AKHFLOW_ATTACHMENTS_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          AKHFLOW_TRELLO_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          AKHFLOW_NATURAL_LANGUAGE_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node ../scripts/smoke_deadlines.mjs --unit

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check container startup and proxy
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps --all || true
              docker compose logs --no-color || true
            fi
            if ! docker compose down --volumes; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up -d --build
          curl_options=(--fail --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 60 --max-time 5)
          curl "${curl_options[@]}" http://localhost:8080/api/health
          curl "${curl_options[@]}" http://localhost:5173/api/health
          curl "${curl_options[@]}" http://localhost:5173/
