name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check container startup and proxy
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --build
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/api/health
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:5173/api/health
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:5173/
